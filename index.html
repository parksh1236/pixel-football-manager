<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#08111f">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 fill=%22%2358e391%22/><text x=%226%22 y=%2222%22 font-size=%2215%22>PT</text></svg>">
  <title>PIXEL TOUCHLINE</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">본문으로 건너뛰기</a>
  <div class="game-shell">
    <header class="topbar">
      <div class="brand" aria-label="Pixel Touchline">
        <span class="brand-mark" aria-hidden="true">PT</span>
        <div><strong>PIXEL TOUCHLINE</strong><small>FOOTBALL MANAGER</small></div>
      </div>
      <div class="club-status">
        <span id="career-context">메인 메뉴</span>
        <span id="club-name">서울 네온 FC</span>
        <strong id="round-status">ROUND 01 / 14</strong>
        <span id="save-status" role="status" aria-live="polite">저장 준비</span>
        <button class="header-button" id="career-exit" hidden>저장 후 메인 메뉴</button>
      </div>
    </header>

    <div class="workspace">
      <nav class="sidebar" aria-label="게임 메뉴" hidden>
        <p class="eyebrow">MANAGER MENU</p>
        <button class="nav-button active" data-view="dashboard" aria-pressed="true"><span>01</span> 대시보드</button>
        <button class="nav-button" data-view="squad" aria-pressed="false"><span>02</span> 선수단</button>
        <button class="nav-button" data-view="fixtures" aria-pressed="false"><span>03</span> 일정</button>
        <button class="nav-button" data-view="table" aria-pressed="false"><span>04</span> 순위표</button>
        <div class="manager-card">
          <span class="pixel-avatar" aria-hidden="true">▦</span>
          <div><small>HEAD COACH</small><strong>MANAGER 01</strong></div>
        </div>
      </nav>

      <main id="app" tabindex="-1"></main>
    </div>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
